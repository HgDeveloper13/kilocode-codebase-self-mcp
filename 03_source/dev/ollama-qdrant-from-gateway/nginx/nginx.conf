events {
    worker_connections 1024;
}

http {
    # Запрещаем логи в локальной разработке (меньше шума)
    access_log off;
    error_log /dev/stderr warn;
    client_body_buffer_size 32m;

    upstream ollama_backend {
        server ollama:11434;
    }

    upstream gateway_backend {
        server gateway:11435;
    }

    upstream qdrant_backend {
        server qdrant:6333;
    }

    # === Ollama API (на :11434) ===
    server {
        listen 11434;
        server_name localhost;

        # Embedding endpoints → Gateway (с Redis кэшем)
        location /api/embed {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты для embedding запросов
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering on;
        }

        # Embeddings endpoint (native) → Gateway (с Redis кэшем)
        location /api/embeddings {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты для embedding запросов
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering on;
        }

        # OpenAI-compatible embeddings endpoint → Gateway (NEW!)
        location /v1/embeddings {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты для embedding запросов
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering on;
        }

        # Все остальные Ollama endpoints → Ollama напрямую
        location / {
            proxy_pass http://ollama_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты для долгих запросов к Ollama (генерация, chat)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;

            # Обязательно для streaming (api/generate, api/chat)
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # === Qdrant API (на :6333) ===
    server {
        listen 6333;
        server_name localhost;

        location / {
            proxy_pass http://qdrant_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Qdrant работает поверх HTTP/JSON — буферинг можно оставить
            proxy_buffering on;
        }

        # Qdrant Dashboard (если нужен)
        location /dashboard/ {
            proxy_pass http://qdrant_backend/dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # === Qdrant gRPC (на :6334) ===
    server {
        # ✅ Правильно: http2 в listen
        listen 6334;
        server_name localhost;
		http2 on;  # ✅ Современный синтаксис (убирает warn в Nginx 1.25+)

        location / {
            grpc_pass grpc://qdrant:6334;
            
            # Заголовки для отслеживания источника запроса
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;

            # Таймауты для долгих gRPC-вызовов (оптимизация, импорт)
            grpc_read_timeout 600s;
            grpc_send_timeout 600s;
            
            # Keep-alive для стабильности соединений
            grpc_socket_keepalive on;
        }
    }
}
