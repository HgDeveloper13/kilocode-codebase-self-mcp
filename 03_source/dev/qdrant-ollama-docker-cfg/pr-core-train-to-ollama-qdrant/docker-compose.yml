services:
  ollama:
    image: ollama/ollama:0.13.5
    container_name: ollama
    # ports НЕ публикуем — только внутри сети
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_GPU_LAYERS=0
      - OLLAMA_NUM_THREADS=4
      - OLLAMA_MAX_QUEUE=1024
      - OLLAMA_KEEP_ALIVE="2h"
      - OLLAMA_DEBUG=false
    networks:
      - internal
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: qdrant
    # ports НЕ публикуем
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    command: ./qdrant --config-path /qdrant/config/production.yaml
    environment:
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/snapshots
      - QDRANT__TELEMETRY_DISABLED=true
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:8.6.2-alpine
    container_name: redis-cache
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - internal
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: embedding-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:11435
      - Ollama__Url=http://ollama:11434
      - Redis__Host=redis
      - Redis__Port=6379
    depends_on:
      - ollama
      - redis
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:1.28.1-alpine
    container_name: nginx-proxy
    ports:
      - "11434:11434"
      - "6333:6333"
      - "6334:6334"
      - "80:80"       # HTTP вход
      - "443:443"     # HTTPS вход (если подключите SSL)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ollama
      - qdrant
      - gateway
    networks:
      - internal
    restart: unless-stopped

volumes:
  ollama:
  qdrant_storage:

networks:
  internal:
    driver: bridge
