services:
  # ASP.NET Core Gateway - NEW entry point
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aspnet-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - UpstreamServices__Ollama=${OLLAMA_URL:-http://localhost:11434}
      - UpstreamServices__Qdrant=${QDRANT_URL:-http://localhost:6333}
    depends_on:
      - ollama
      - qdrant
    networks:
      - internal
    restart: unless-stopped

  # Nginx - reverse proxy (routes through gateway or direct to services)
  nginx:
    image: nginx:1.28.1-alpine
    container_name: nginx-proxy
    ports:
      - "${OLLAMA_PORT:-11434}:11434"   # Ollama direct
      - "${QDRANT_HTTP_PORT:-6333}:6333"     # Qdrant REST direct
      - "${QDRANT_GRPC_PORT:-6334}:6334"     # Qdrant gRPC direct
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ollama
      - qdrant
      - gateway
    networks:
      - internal
    restart: unless-stopped

  # Ollama - LLM inference
  ollama:
    image: ollama/ollama:0.13.5
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_GPU_LAYERS=${OLLAMA_GPU_LAYERS:-0}
      - OLLAMA_NUM_THREADS=${OLLAMA_NUM_THREADS:-4}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-1024}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-2h}
      - OLLAMA_DEBUG=${OLLAMA_DEBUG:-false}
    networks:
      - internal
    restart: unless-stopped

  # Qdrant - Vector database
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    command: ./qdrant --config-path /qdrant/config/production.yaml
    environment:
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/snapshots
      - QDRANT__TELEMETRY_DISABLED=${QDRANT_TELEMETRY_DISABLED:-true}
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  ollama_data:
  qdrant_storage:
